<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FOODPICKER ITF</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="logo">FOODPICKER ITF</div>
  </nav>

  <!-- Main Food Display -->
  <main class="container">
    <div class="card">
      <div class="image-container">
        <img id="food-img" src="https://images.unsplash.com/photo-1626804475297-4160820ce4ec?w=600&auto=format&fit=crop" alt="Food Image">
      </div>
      <h2 id="food-name">ข้าวมันไก่</h2>
      <p id="food-desc" class="desc">ข้าวมันหอมนุ่มเสิร์ฟพร้อมไก่นุ่มและน้ำจิ้มเต้าเจี้ยวรสเด็ด</p>
      <div class="price-tag">ราคา <span id="food-price">50 - 65</span> บาท</div>
      <button id="random-btn" class="btn">สุ่มเมนูอาหาร</button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
